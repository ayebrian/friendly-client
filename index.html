<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A social network without recommendations. Grow your circle through friends and friends of friends, share everyday things, and keep the conversation going on Friendly."
    />
    <meta name="theme-color" content="%INITIAL_THEME_COLOR%" />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- initial-theme-styles -->
    <script>
      (() => {
        let theme = 'system';
        try {
          const saved = localStorage.getItem('friendly.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          // Theme preferences are optional when browser storage is unavailable.
        }
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            'content',
            getComputedStyle(root).getPropertyValue('--color-canvas').trim(),
          );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Friendly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
