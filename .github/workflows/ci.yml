name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Self-hosted runner mc-friendly-client on the owner's server mc.
    runs-on: [self-hosted, linux, mc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.10.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run proxy:build
